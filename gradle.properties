# ---------------------------------------------------------------------------
# Plugin coordinates
# ---------------------------------------------------------------------------
pluginGroup = dev.anchorwindows
pluginName = anchor-windows
pluginVersion = 0.7.1

# Plugin compatibility range (Rider build numbers). 263 = 2026.3.x.
# 263 moved JNA into the bundled com.intellij.modules.jna plugin, which does not exist
# in 261/262 - use plugin 0.6.0 for those.
pluginSinceBuild = 263
pluginUntilBuild = 263.*

# ---------------------------------------------------------------------------
# Target platform — Rider (the plugin is frontend-only and platform-generic,
# but we compile against the same SDK that runs it).
# ---------------------------------------------------------------------------
platformType = RD
platformVersion = 2026.3

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs = -Xmx4g -XX:+UseParallelGC
org.gradle.configuration-cache = false
org.gradle.caching = true
# The IDE provides the Kotlin stdlib at runtime; do not bundle our own.
kotlin.stdlib.default.dependency = false
