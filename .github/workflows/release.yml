name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extracting the multi-GB Rider SDK overflows the stock runner disk without this
      # (tool-cache + large-packages are the settings that actually free space).
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle (incl. downloaded Rider SDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: ./gradlew --no-daemon --console=plain buildPlugin "-Dorg.gradle.java.installations.paths=$JAVA_HOME"

      - name: Publish GitHub release with the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

      # Keep the custom plugin repository (updatePlugins.xml on main) pointing at this release,
      # so IDEs with the repository URL configured see the update.
      - name: Update updatePlugins.xml on main
        run: |
          # Re-running an old tag's workflow must not point the XML back at an old version:
          # only the newest v* tag may regenerate it.
          git fetch --tags origin
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ "$GITHUB_REF_NAME" != "$LATEST" ]; then
            echo "not the newest tag (newest is $LATEST), leaving updatePlugins.xml untouched"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SINCE=$(grep -oP 'pluginSinceBuild\s*=\s*\K\S+' gradle.properties)
          UNTIL=$(grep -oP 'pluginUntilBuild\s*=\s*\K\S+' gradle.properties)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Custom plugin repository (JetBrains "Manage Plugin Repositories" format).
               Add https://raw.githubusercontent.com/gaetan-deturche/rider-anchor-windows/main/updatePlugins.xml
               in Settings | Plugins | gear | Manage Plugin Repositories to receive updates.
               Regenerated by the release workflow on every v* tag. -->
          <plugins>
            <plugin id="dev.anchorwindows"
                    url="https://github.com/gaetan-deturche/rider-anchor-windows/releases/download/v${VERSION}/anchor-windows-${VERSION}.zip"
                    version="${VERSION}">
              <idea-version since-build="${SINCE}" until-build="${UNTIL}"/>
            </plugin>
          </plugins>
          EOF
          # Stage first, then test the index: `git diff --quiet <file>` ignores untracked
          # files, which would silently skip the commit in a repo where CI creates the file.
          git add updatePlugins.xml
          if ! git diff --cached --quiet; then
            git commit -m "Point updatePlugins.xml at v${VERSION}"
            git push origin main
          fi
